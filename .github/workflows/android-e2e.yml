name: Android E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Run Android E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Start emulator and run Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: "google_apis"
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          script: npm run run.android.tests

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: "./junit-results/test-report-android-*.xml"
          check_name: "Android Test results"
          check_title_template: "{{TEST_NAME}}"
          summary: "Android test results for DPG Interview"
          detailed_summary: true
          flaky_summary: true
          check_retries: true
          include_passed: true
          include_skipped: true
          skip_success_summary: false
          fail_on_parse_error: false
          verbose_summary: true
          group_suite: true
          annotate_only: true

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean --output allure-report

      - name: Upload Allure report for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy-allure-report:
    name: Deploy Allure report to GitHub Pages
    needs: android-e2e
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
